<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        FIFO Accounting System
    </title>

    <link
        rel="stylesheet"
        href="frontend/css/splash.css"
    >

</head>


<body>


<div class="splash-screen">

    <div class="splash-content">


        <!-- LOGO -->

        <div class="splash-logo-wrapper">

            <img
                src="frontend/assets/logo.png"
                alt="FIFO Accounting System"
                class="splash-logo"
                onerror="
                    this.style.display='none';
                    document.getElementById('splashLogoFallback').style.display='flex';
                "
            >

            <div
                id="splashLogoFallback"
                class="splash-logo-fallback"
            >
                F
            </div>

        </div>


        <!-- BRAND -->

        <h1>
            FIFO ACCOUNTING SYSTEM
        </h1>

        <p>
            Sistem Akuntansi Persediaan Berbasis FIFO
        </p>


        <!-- LOADING -->

        <div class="splash-loading">

            <span></span>
            <span></span>
            <span></span>

        </div>


        <small>
            Initializing system...
        </small>


    </div>

</div>


<script>

    /*
       DEMO SESSION

       Login tidak menggunakan Supabase Auth.
       Session hanya disimpan di browser.
    */

    const SESSION_KEY =
        "fifo_demo_session_v2";


    const session =
        localStorage.getItem(
            SESSION_KEY
        );


    setTimeout(
        function () {

            if (session) {

                /*
                   Sudah login
                */

                window.location.href =
                    "frontend/html/dashboard.html";

            } else {

                /*
                   Belum login
                */

                window.location.href =
                    "frontend/html/login.html";

            }

        },
        1200
    );

</script>


</body>

</html>
